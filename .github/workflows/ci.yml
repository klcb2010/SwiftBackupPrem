
name: CI

on:
  push:
    branches:
      - main
      - master
      - testing
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Screenshots/**'
      - '.idea/**'
      - 'LICENSE'
      - 'SCOPE'
      - 'SUMMARY'
      - 'SOURCE_URL'
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - master
      - testing
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Screenshots/**'
      - '.idea/**'
      - 'LICENSE'
      - 'SCOPE'
      - 'SUMMARY'
      - 'SOURCE_URL'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Assemble Debug and Release APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      # Actions Artifact 仍然保留，方便在 CI 页面调试下载。
      # GitHub 会把 Artifact 打包成 ZIP，这是正常行为。
      - name: Upload Release APK & ProGuard Mapping Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SwiftBackupPrem-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SwiftBackupPrem-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Test and Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      # ------------------------------------------------------------
      # Release
      #
      # 只有真正的 v* Tag 才发布。
      # Tag 完全使用上游同步过来的 Tag。
      #
      # 例如：
      #   上游：v2.3.1
      #   本地：没有 v2.3.1 Release
      #       -> 创建 v2.3.1 Release
      #
      #   上游：v2.3.1
      #   本地：已经存在 v2.3.1 Release
      #       -> 跳过
      # ------------------------------------------------------------

      - name: Get Upstream Release Tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Release tag: $TAG_NAME"
          echo "======================================"

      - name: Check Existing GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          echo "Checking GitHub Release: $TAG_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists: $TAG_NAME"
            echo "Publishing will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release does not exist: $TAG_NAME"
            echo "A new Release will be created."
          fi

      - name: Create GitHub Release
        if: >
          startsWith(github.ref, 'refs/tags/v') &&
          steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.release_tag.outputs.tag, 'preview') || contains(steps.release_tag.outputs.tag, 'alpha') || contains(steps.release_tag.outputs.tag, 'beta') || contains(steps.release_tag.outputs.tag, 'rc') }}

      - name: Release Skipped
        if: >
          startsWith(github.ref, 'refs/tags/v') &&
          steps.check_release.outputs.exists == 'true'
        shell: bash
        run: |
          echo "======================================"
          echo "Release already exists"
          echo "Tag: ${{ steps.release_tag.outputs.tag }}"
          echo "Publishing skipped."
          echo "======================================"

