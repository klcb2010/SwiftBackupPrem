name: Sync Upstream + Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.ref }}

      # =========================================================
      # 2. Git
      # =========================================================
      - name: Configure Git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # =========================================================
      # 3. 显示当前 workflow 实际版本
      # =========================================================
      - name: Show workflow revision
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Workflow runtime"
          echo "================================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Ref        : $GITHUB_REF"
          echo "SHA        : $GITHUB_SHA"
          echo "Workflow   : $GITHUB_WORKFLOW"
          echo "Run ID     : $GITHUB_RUN_ID"
          echo "Run Number : $GITHUB_RUN_NUMBER"
          echo "Event      : $GITHUB_EVENT_NAME"
          echo "================================================="

          echo
          echo "[HEAD]"
          git rev-parse HEAD

          echo
          echo "[workflow]"
          test -f .github/workflows/upstream-sync.yml
          head -n 10 .github/workflows/upstream-sync.yml

      # =========================================================
      # 4. 添加 upstream
      # =========================================================
      - name: Add upstream
        run: |
          set -euo pipefail

          git remote remove upstream 2>/dev/null || true

          git remote add upstream \
            https://github.com/s1ddhants1/SwiftBackupPrem.git

          git fetch upstream main --depth=1

          echo
          echo "[upstream]"
          git rev-parse upstream/main

      # =========================================================
      # 5. 判断 upstream 是否变化
      #
      # 注意：
      # 这里仅用于判断“是否需要同步 upstream”。
      # 不再决定是否执行本地 mod / build。
      # =========================================================
      - name: Check upstream change
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_SHA="$(git rev-parse upstream/main)"

          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          if [ -f .upstream.sha ]; then
            LAST_SHA="$(tr -d '[:space:]' < .upstream.sha)"
          else
            LAST_SHA=""
          fi

          echo "last=$LAST_SHA"
          echo "upstream=$UPSTREAM_SHA"

          if [ "$LAST_SHA" = "$UPSTREAM_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[INFO] upstream unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "[INFO] upstream changed"
          fi

      # =========================================================
      # 6. 判断是否手动运行
      #
      # workflow_dispatch = 强制测试本地 mod + build
      # =========================================================
      - name: Decide execution
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"

            echo
            echo "[RUN] manual workflow dispatch"
            echo "[RUN] local mod + build will ALWAYS execute"

          elif [ "${{ steps.upstream.outputs.changed }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"

            echo
            echo "[RUN] upstream changed"

          else
            echo "run=false" >> "$GITHUB_OUTPUT"

            echo
            echo "[SKIP] scheduled run + upstream unchanged"
          fi

      # =========================================================
      # 7. 保存本地文件
      #
      # 只有真正需要同步 upstream 时才执行。
      # 手动测试但 upstream 没变化，不需要 read-tree。
      # =========================================================
      - name: Save protected local files
        if: steps.decision.outputs.run == 'true' && steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/local-protected

          mkdir -p \
            /tmp/local-protected \
            /tmp/local-protected/.github/workflows

          # mod
          test -d mod

          cp -a \
            mod \
            /tmp/local-protected/mod

          echo "[protect] mod/"

          # ci.yml
          if [ -f .github/workflows/ci.yml ]; then
            cp \
              .github/workflows/ci.yml \
              /tmp/local-protected/.github/workflows/ci.yml

            echo "[protect] .github/workflows/ci.yml"
          fi

          # upstream-sync.yml
          test -f .github/workflows/upstream-sync.yml

          cp \
            .github/workflows/upstream-sync.yml \
            /tmp/local-protected/.github/workflows/upstream-sync.yml

          echo "[protect] .github/workflows/upstream-sync.yml"

      # =========================================================
      # 8. 同步 upstream
      #
      # 只有 upstream 真变化才 reset。
      #
      # 手动运行 + upstream 没变化：
      # 保持当前仓库工作树，直接测试 mod。
      # =========================================================
      - name: Sync upstream
        if: steps.decision.outputs.run == 'true' && steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "[sync] synchronizing upstream..."

          git read-tree -u --reset upstream/main

          echo "[sync] restoring local protected files..."

          # mod
          rm -rf mod

          cp -a \
            /tmp/local-protected/mod \
            mod

          echo "[restore] mod/"

          # ci.yml
          if [ -f /tmp/local-protected/.github/workflows/ci.yml ]; then
            mkdir -p .github/workflows

            cp \
              /tmp/local-protected/.github/workflows/ci.yml \
              .github/workflows/ci.yml

            echo "[restore] .github/workflows/ci.yml"
          fi

          # workflow
          cp \
            /tmp/local-protected/.github/workflows/upstream-sync.yml \
            .github/workflows/upstream-sync.yml

          echo "[restore] .github/workflows/upstream-sync.yml"

          echo
          echo "[OK] upstream synchronized"

      # =========================================================
      # 9. 验证本地 mod
      # =========================================================
      - name: Verify local mod
        if: steps.decision.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Verify local mod"
          echo "================================================="

          test -d mod
          test -f mod/ModHook.kt
          test -f mod/apply.sh
          test -f mod/Module.patch

          echo
          echo "[OK] local mod files exist"

          echo
          echo "[mod]"
          find mod -maxdepth 2 -type f -print | sort

      # =========================================================
      # 10. 应用 mod
      #
      # 现在不再依赖 upstream changed。
      # =========================================================
      - name: Apply local mod
        if: steps.decision.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Apply local mod"
          echo "================================================="

          chmod +x mod/apply.sh

          ./mod/apply.sh

          echo
          echo "[OK] local mod applied"

      # =========================================================
      # 11. Java
      # =========================================================
      - name: Setup Java
        if: steps.decision.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 12. Android SDK
      # =========================================================
      - name: Setup Android SDK
        if: steps.decision.outputs.run == 'true'
        uses: android-actions/setup-android@v3

      # =========================================================
      # 13. Gradle
      # =========================================================
      - name: Setup Gradle
        if: steps.decision.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4

      # =========================================================
      # 14. Build
      # =========================================================
      - name: Build release
        if: steps.decision.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "================================================="
          echo "Build release"
          echo "================================================="

          ./gradlew \
            :app:assembleRelease \
            --stacktrace

          echo
          echo "[OK] release build completed"

      # =========================================================
      # 15. 更新 upstream SHA
      #
      # 只有真正同步 upstream 后才更新。
      #
      # 手动测试且 upstream 没变化：
      # 不碰 .upstream.sha。
      # =========================================================
      - name: Record upstream SHA
        if: steps.decision.outputs.run == 'true' && steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ steps.upstream.outputs.sha }}" > .upstream.sha

          echo "[upstream.sha]"
          cat .upstream.sha

      # =========================================================
      # 16. 最终验证
      # =========================================================
      - name: Final verification
        if: steps.decision.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Final verification"
          echo "================================================="

          test -d mod
          test -f mod/ModHook.kt
          test -f mod/apply.sh
          test -f mod/Module.patch

          test -f .github/workflows/ci.yml
          test -f .github/workflows/upstream-sync.yml

          grep -Fq \
            'name: Sync Upstream + Build' \
            .github/workflows/upstream-sync.yml

          grep -Fq \
            'git read-tree -u --reset upstream/main' \
            .github/workflows/upstream-sync.yml

          grep -Fq \
            'upstream-sync.yml' \
            .github/workflows/upstream-sync.yml

          echo
          echo "[OK] final verification passed"

          echo
          echo "[git status]"
          git status --short

      # =========================================================
      # 17. Commit
      #
      # 只有 upstream 真变化时才提交同步结果。
      #
      # 手动测试本地 mod 不会产生无意义 sync commit。
      # =========================================================
      - name: Commit and push
        if: steps.decision.outputs.run == 'true' && steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "[SKIP] nothing to commit"
            exit 0
          fi

          echo
          echo "================================================="
          echo "Commit files"
          echo "================================================="

          git diff --cached --name-status

          git commit \
            -m "sync: upstream ${{ steps.upstream.outputs.sha }}"

          git push origin HEAD:main

          echo
          echo "[OK] pushed to main"

      # =========================================================
      # 18. 上传 APK
      # =========================================================
      - name: Upload APK
        if: steps.decision.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SwiftBackupPrem-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/*
          if-no-files-found: warn
