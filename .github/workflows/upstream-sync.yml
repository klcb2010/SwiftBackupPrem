name: Sync Upstream + Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1. Checkout 当前触发 workflow 的 commit
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.ref }}

      # =========================================================
      # 2. Git 配置
      # =========================================================
      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # =========================================================
      # 3. 显示当前 workflow 实际运行版本
      #
      # 这个非常重要：
      # 防止误以为 GitHub 正在运行 main 上的新版 workflow。
      # =========================================================
      - name: Show workflow revision
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "GitHub workflow runtime information"
          echo "================================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Ref        : $GITHUB_REF"
          echo "SHA        : $GITHUB_SHA"
          echo "Workflow   : $GITHUB_WORKFLOW"
          echo "Run ID     : $GITHUB_RUN_ID"
          echo "Run Number : $GITHUB_RUN_NUMBER"
          echo "Actor      : $GITHUB_ACTOR"
          echo "Event      : $GITHUB_EVENT_NAME"
          echo "================================================="

          echo
          echo "[current commit]"
          git rev-parse HEAD

          echo
          echo "[workflow file]"
          test -f .github/workflows/upstream-sync.yml
          head -n 10 .github/workflows/upstream-sync.yml

      # =========================================================
      # 4. 添加 upstream
      # =========================================================
      - name: Add upstream
        shell: bash
        run: |
          set -euo pipefail

          git remote remove upstream 2>/dev/null || true

          git remote add upstream \
            https://github.com/s1ddhants1/SwiftBackupPrem.git

          git fetch upstream main --depth=1

          echo
          echo "[upstream]"
          git rev-parse upstream/main

      # =========================================================
      # 5. 判断 upstream 是否变化
      # =========================================================
      - name: Check upstream change
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_SHA="$(git rev-parse upstream/main)"

          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          if [ -f .upstream.sha ]; then
            LAST_SHA="$(tr -d '[:space:]' < .upstream.sha)"
          else
            LAST_SHA=""
          fi

          echo "last=$LAST_SHA"
          echo "upstream=$UPSTREAM_SHA"

          if [ "$LAST_SHA" = "$UPSTREAM_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo
            echo "[SKIP] upstream unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo
            echo "[RUN] upstream changed"
          fi

      # =========================================================
      # 6. 保存本地 mod 和 workflow
      #
      # 这些文件不能被 upstream 覆盖。
      # =========================================================
      - name: Save protected local files
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/local-protected
          mkdir -p /tmp/local-protected/.github/workflows

          # -----------------------------------------------------
          # mod/
          # -----------------------------------------------------
          if [ -d mod ]; then
            cp -a mod /tmp/local-protected/mod
            echo "[protect] mod/"
          else
            echo "[FAIL] mod/ not found"
            exit 1
          fi

          # -----------------------------------------------------
          # ci.yml
          # -----------------------------------------------------
          if [ -f .github/workflows/ci.yml ]; then
            cp \
              .github/workflows/ci.yml \
              /tmp/local-protected/.github/workflows/ci.yml

            echo "[protect] .github/workflows/ci.yml"
          fi

          # -----------------------------------------------------
          # upstream-sync.yml
          # -----------------------------------------------------
          if [ -f .github/workflows/upstream-sync.yml ]; then
            cp \
              .github/workflows/upstream-sync.yml \
              /tmp/local-protected/.github/workflows/upstream-sync.yml

            echo "[protect] .github/workflows/upstream-sync.yml"
          else
            echo "[FAIL] upstream-sync.yml not found"
            exit 1
          fi

      # =========================================================
      # 7. 同步 upstream
      # =========================================================
      - name: Sync upstream
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "[sync] replacing working tree with upstream/main..."

          git read-tree -u --reset upstream/main

          echo "[sync] restoring protected local files..."

          # -----------------------------------------------------
          # mod/
          # -----------------------------------------------------
          rm -rf mod

          cp -a \
            /tmp/local-protected/mod \
            mod

          echo "[restore] mod/"

          # -----------------------------------------------------
          # ci.yml
          # -----------------------------------------------------
          if [ -f /tmp/local-protected/.github/workflows/ci.yml ]; then
            mkdir -p .github/workflows

            cp \
              /tmp/local-protected/.github/workflows/ci.yml \
              .github/workflows/ci.yml

            echo "[restore] .github/workflows/ci.yml"
          fi

          # -----------------------------------------------------
          # upstream-sync.yml
          # -----------------------------------------------------
          cp \
            /tmp/local-protected/.github/workflows/upstream-sync.yml \
            .github/workflows/upstream-sync.yml

          echo "[restore] .github/workflows/upstream-sync.yml"

          echo
          echo "[OK] upstream synchronized"

      # =========================================================
      # 8. 验证 protected files
      # =========================================================
      - name: Verify protected files
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "[verify] checking protected files..."

          test -d mod
          test -f mod/ModHook.kt
          test -f mod/apply.sh
          test -f mod/Module.patch

          test -f .github/workflows/ci.yml
          test -f .github/workflows/upstream-sync.yml

          echo "[OK] protected files exist"

          echo
          echo "================================================="
          echo "Current upstream-sync.yml"
          echo "================================================="

          sed -n '1,30p' .github/workflows/upstream-sync.yml

      # =========================================================
      # 9. 应用本地 mod
      # =========================================================
      - name: Apply local mod
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "[mod] applying local modification..."

          chmod +x mod/apply.sh

          ./mod/apply.sh

          echo "[OK] local mod applied"

      # =========================================================
      # 10. 验证 mod
      # =========================================================
      - name: Verify mod
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "[verify] checking mod..."

          test -f mod/ModHook.kt
          test -f mod/apply.sh
          test -f mod/Module.patch

          echo
          echo "[mod files]"
          find mod -maxdepth 2 -type f -print | sort

          echo
          echo "[OK] mod verification passed"

      # =========================================================
      # 11. 检查 LibXposed API
      # =========================================================
      - name: Verify API 102
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "[verify] checking LibXposed API..."

          if [ -f gradle/libs.versions.toml ]; then
            grep -n \
              '102.0.0' \
              gradle/libs.versions.toml \
              || true
          fi

          echo
          echo "[OK] API verification finished"

      # =========================================================
      # 12. Java
      # =========================================================
      - name: Setup Java
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 13. Android SDK
      # =========================================================
      - name: Setup Android SDK
        if: steps.upstream.outputs.changed == 'true'
        uses: android-actions/setup-android@v3

      # =========================================================
      # 14. Gradle
      # =========================================================
      - name: Setup Gradle
        if: steps.upstream.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4

      # =========================================================
      # 15. Build
      # =========================================================
      - name: Build release
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "[build] starting release build..."

          ./gradlew \
            :app:assembleRelease \
            --stacktrace

          echo "[OK] release build completed"

      # =========================================================
      # 16. 写入 upstream SHA
      # =========================================================
      - name: Record upstream SHA
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ steps.upstream.outputs.sha }}" > .upstream.sha

          echo "[upstream.sha]"
          cat .upstream.sha

      # =========================================================
      # 17. 最终验证
      #
      # 注意：
      # 这里验证的是“准备提交到 main 的最终工作树”。
      # =========================================================
      - name: Final verification
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "================================================="
          echo "Final verification"
          echo "================================================="

          # mod
          test -d mod
          test -f mod/ModHook.kt
          test -f mod/apply.sh
          test -f mod/Module.patch

          # workflows
          test -f .github/workflows/ci.yml
          test -f .github/workflows/upstream-sync.yml

          # workflow identity
          grep -Fq \
            'name: Sync Upstream + Build' \
            .github/workflows/upstream-sync.yml

          # upstream reset
          grep -Fq \
            'git read-tree -u --reset upstream/main' \
            .github/workflows/upstream-sync.yml

          # self protection
          grep -Fq \
            'upstream-sync.yml' \
            .github/workflows/upstream-sync.yml

          echo
          echo "[OK] final protected-file verification passed"

          echo
          echo "[git status]"
          git status --short

      # =========================================================
      # 18. Commit
      # =========================================================
      - name: Commit changes
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "[SKIP] nothing to commit"
            exit 0
          fi

          echo
          echo "================================================="
          echo "Files to commit"
          echo "================================================="

          git diff --cached --name-status

          git commit \
            -m "sync: upstream ${{ steps.upstream.outputs.sha }}"

      # =========================================================
      # 19. Push
      # =========================================================
      - name: Push changes
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo "[OK] pushed to main"

      # =========================================================
      # 20. 上传 APK
      # =========================================================
      - name: Upload APK
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SwiftBackupPrem-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/*
          if-no-files-found: warn
