name: Sync Upstream + Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ---------------------------------------------------------
      # Git
      # ---------------------------------------------------------
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ---------------------------------------------------------
      # Upstream
      # ---------------------------------------------------------
      - name: Add upstream
        shell: bash
        run: |
          set -euo pipefail

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/s1ddhants1/SwiftBackupPrem.git
          git fetch upstream main --depth=1

      # ---------------------------------------------------------
      # Check upstream change
      # ---------------------------------------------------------
      - name: Check upstream change
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          if [ -f .upstream.sha ]; then
            LAST_SHA="$(tr -d '[:space:]' < .upstream.sha)"
          else
            LAST_SHA=""
          fi

          echo "last=$LAST_SHA"
          echo "upstream=$UPSTREAM_SHA"

          if [ "$LAST_SHA" = "$UPSTREAM_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[SKIP] upstream unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "[RUN] upstream changed"
          fi

      # ---------------------------------------------------------
      # Save protected local files
      #
      # IMPORTANT:
      # These files MUST survive git read-tree.
      # ---------------------------------------------------------
      - name: Save protected local files
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/local-protected
          mkdir -p /tmp/local-protected

          # Protect mod/
          if [ -d mod ]; then
            cp -a mod /tmp/local-protected/mod
            echo "[protect] mod/"
          fi

          # Protect ci.yml
          if [ -f .github/workflows/ci.yml ]; then
            mkdir -p /tmp/local-protected/.github/workflows

            cp .github/workflows/ci.yml \
              /tmp/local-protected/.github/workflows/ci.yml

            echo "[protect] .github/workflows/ci.yml"
          fi

          # Protect THIS workflow.
          if [ -f .github/workflows/upstream-sync.yml ]; then
            mkdir -p /tmp/local-protected/.github/workflows

            cp .github/workflows/upstream-sync.yml \
              /tmp/local-protected/.github/workflows/upstream-sync.yml

            echo "[protect] .github/workflows/upstream-sync.yml"
          else
            echo "[FAIL] upstream-sync.yml not found before sync"
            exit 1
          fi

      # ---------------------------------------------------------
      # Sync upstream
      # ---------------------------------------------------------
      - name: Sync upstream
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "[sync] synchronizing upstream..."

          # Replace working tree with upstream.
          git read-tree -u --reset upstream/main

          echo "[sync] restoring protected local files..."

          # Restore mod/
          if [ -d /tmp/local-protected/mod ]; then
            rm -rf mod
            cp -a /tmp/local-protected/mod mod
            echo "[restore] mod/"
          fi

          # Restore ci.yml
          if [ -f /tmp/local-protected/.github/workflows/ci.yml ]; then
            mkdir -p .github/workflows

            cp /tmp/local-protected/.github/workflows/ci.yml \
              .github/workflows/ci.yml

            echo "[restore] .github/workflows/ci.yml"
          fi

          # Restore THIS workflow.
          if [ -f /tmp/local-protected/.github/workflows/upstream-sync.yml ]; then
            mkdir -p .github/workflows

            cp /tmp/local-protected/.github/workflows/upstream-sync.yml \
              .github/workflows/upstream-sync.yml

            echo "[restore] .github/workflows/upstream-sync.yml"
          fi

          echo "[OK] upstream synced"

      # ---------------------------------------------------------
      # HARD verification
      #
      # If upstream-sync.yml disappeared or got replaced,
      # immediately fail BEFORE build/commit.
      # ---------------------------------------------------------
      - name: Verify protected files
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "[verify] protected files..."

          test -d mod
          test -f mod/ModHook.kt
          test -f mod/apply.sh
          test -f mod/Module.patch

          test -f .github/workflows/ci.yml
          test -f .github/workflows/upstream-sync.yml

          echo "[OK] all protected files are present"

          echo "[verify] workflow identity:"
          head -n 5 .github/workflows/upstream-sync.yml

      # ---------------------------------------------------------
      # Apply local modification
      # ---------------------------------------------------------
      - name: Apply local mod
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x mod/apply.sh
          ./mod/apply.sh

      # ---------------------------------------------------------
      # Verify API 102 / mod files
      # ---------------------------------------------------------
      - name: Verify API 102
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking LibXposed API..."

          grep -R \
            '102.0.0' \
            gradle/libs.versions.toml \
            || true

          test -f mod/ModHook.kt
          test -f mod/apply.sh
          test -f mod/Module.patch

          echo "[OK] mod files present"

      # ---------------------------------------------------------
      # Build environment
      # ---------------------------------------------------------
      - name: Setup Java
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        if: steps.upstream.outputs.changed == 'true'
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        if: steps.upstream.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: Build release
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew :app:assembleRelease --stacktrace

      # ---------------------------------------------------------
      # Record upstream SHA
      # ---------------------------------------------------------
      - name: Record upstream SHA
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ steps.upstream.outputs.sha }}" > .upstream.sha

      # ---------------------------------------------------------
      # Final verification BEFORE commit
      # ---------------------------------------------------------
      - name: Final verification
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "[verify] final files before commit..."

          test -d mod
          test -f mod/ModHook.kt
          test -f mod/apply.sh
          test -f mod/Module.patch

          test -f .github/workflows/ci.yml
          test -f .github/workflows/upstream-sync.yml

          grep -Fq \
            'name: Sync Upstream + Build' \
            .github/workflows/upstream-sync.yml

          grep -Fq \
            'git read-tree -u --reset upstream/main' \
            .github/workflows/upstream-sync.yml

          grep -Fq \
            'upstream-sync.yml' \
            .github/workflows/upstream-sync.yml

          echo "[OK] final protected-file verification passed"

      # ---------------------------------------------------------
      # Commit and push
      # ---------------------------------------------------------
      - name: Commit and push
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "[SKIP] no changes to commit"
            exit 0
          fi

          echo "[commit] files:"
          git diff --cached --name-status

          git commit \
            -m "sync: upstream ${{ steps.upstream.outputs.sha }}"

          git push origin HEAD:main

          echo "[OK] pushed to main"

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SwiftBackupPrem-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/*
          if-no-files-found: warn
