name: Sync Upstream + Build + Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.ref }}

      # =========================================================
      # 2. Configure Git
      # =========================================================
      - name: Configure Git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # =========================================================
      # 3. Show workflow revision
      # =========================================================
      - name: Show workflow revision
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Workflow runtime"
          echo "================================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Ref        : $GITHUB_REF"
          echo "SHA        : $GITHUB_SHA"
          echo "Workflow   : $GITHUB_WORKFLOW"
          echo "Run ID     : $GITHUB_RUN_ID"
          echo "Run Number : $GITHUB_RUN_NUMBER"
          echo "Event      : $GITHUB_EVENT_NAME"
          echo "================================================="

          echo
          echo "[HEAD]"
          git rev-parse HEAD

          echo
          echo "[workflow]"
          test -f .github/workflows/upstream-sync.yml
          head -n 10 .github/workflows/upstream-sync.yml

      # =========================================================
      # 4. Add upstream
      # =========================================================
      - name: Add upstream
        run: |
          set -euo pipefail

          git remote remove upstream 2>/dev/null || true

          git remote add upstream \
            https://github.com/s1ddhants1/SwiftBackupPrem.git

          # 同步主分支
          git fetch upstream main --depth=1

          # 获取上游 v* Tag
          git fetch upstream \
            '+refs/tags/v*:refs/tags/upstream-v*' \
            --force

          echo
          echo "[upstream main]"
          git rev-parse upstream/main

          echo
          echo "[upstream v* tags]"
          git tag \
            --list 'upstream-v*' \
            --sort=-v:refname \
            | head -n 20 || true

      # =========================================================
      # 5. Check upstream change
      # =========================================================
      - name: Check upstream change
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_SHA="$(git rev-parse upstream/main)"

          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          if [ -f .upstream.sha ]; then
            LAST_SHA="$(tr -d '[:space:]' < .upstream.sha)"
          else
            LAST_SHA=""
          fi

          echo "last=$LAST_SHA"
          echo "upstream=$UPSTREAM_SHA"

          if [ "$LAST_SHA" = "$UPSTREAM_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[INFO] upstream unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "[INFO] upstream changed"
          fi

      # =========================================================
      # 6. Decide execution
      #
      # 手动运行：
      #   永远执行 mod + build
      #
      # 定时运行：
      #   upstream 有变化才执行
      # =========================================================
      - name: Decide execution
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"

            echo
            echo "[RUN] manual workflow dispatch"
            echo "[RUN] local mod + build will ALWAYS execute"

          elif [ "${{ steps.upstream.outputs.changed }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"

            echo
            echo "[RUN] upstream changed"

          else
            echo "run=false" >> "$GITHUB_OUTPUT"

            echo
            echo "[SKIP] scheduled run + upstream unchanged"
          fi

      # =========================================================
      # 7. Save protected local files
      # =========================================================
      - name: Save protected local files
        if: steps.decision.outputs.run == 'true' && steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/local-protected

          mkdir -p \
            /tmp/local-protected \
            /tmp/local-protected/.github/workflows

          # mod
          test -d mod

          cp -a \
            mod \
            /tmp/local-protected/mod

          echo "[protect] mod/"

          # ci.yml
          if [ -f .github/workflows/ci.yml ]; then
            cp \
              .github/workflows/ci.yml \
              /tmp/local-protected/.github/workflows/ci.yml

            echo "[protect] .github/workflows/ci.yml"
          fi

          # upstream-sync.yml
          test -f .github/workflows/upstream-sync.yml

          cp \
            .github/workflows/upstream-sync.yml \
            /tmp/local-protected/.github/workflows/upstream-sync.yml

          echo "[protect] .github/workflows/upstream-sync.yml"

      # =========================================================
      # 8. Sync upstream
      # =========================================================
      - name: Sync upstream
        if: steps.decision.outputs.run == 'true' && steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "[sync] synchronizing upstream..."

          git read-tree -u --reset upstream/main

          echo "[sync] restoring local protected files..."

          # mod
          rm -rf mod

          cp -a \
            /tmp/local-protected/mod \
            mod

          echo "[restore] mod/"

          # ci.yml
          if [ -f /tmp/local-protected/.github/workflows/ci.yml ]; then
            mkdir -p .github/workflows

            cp \
              /tmp/local-protected/.github/workflows/ci.yml \
              .github/workflows/ci.yml

            echo "[restore] .github/workflows/ci.yml"
          fi

          # upstream-sync.yml
          cp \
            /tmp/local-protected/.github/workflows/upstream-sync.yml \
            .github/workflows/upstream-sync.yml

          echo "[restore] .github/workflows/upstream-sync.yml"

          echo
          echo "[OK] upstream synchronized"

      # =========================================================
      # 9. Verify local mod
      # =========================================================
      - name: Verify local mod
        if: steps.decision.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Verify local mod"
          echo "================================================="

          test -d mod
          test -f mod/ModHook.kt
          test -f mod/apply.sh
          test -f mod/Module.patch

          echo
          echo "[OK] local mod files exist"

          echo
          echo "[mod files]"
          find mod -maxdepth 2 -type f -print | sort

      # =========================================================
      # 10. Apply local mod
      # =========================================================
      - name: Apply local mod
        if: steps.decision.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Apply local mod"
          echo "================================================="

          chmod +x mod/apply.sh

          ./mod/apply.sh

          echo
          echo "[OK] local mod applied"

      # =========================================================
      # 11. Verify generated ModHook
      # =========================================================
      - name: Verify generated ModHook
        if: steps.decision.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Verify generated ModHook"
          echo "================================================="

          echo
          echo "[1/6] Searching generated ModHook.kt..."

          MODHOOK_FILES="$(
            find app/src \
              -type f \
              -name 'ModHook.kt' \
              -print \
              2>/dev/null || true
          )"

          if [ -z "$MODHOOK_FILES" ]; then
            echo "[FAIL] ModHook.kt was not injected into app/src"

            echo
            echo "[app/src files]"
            find app/src \
              -type f \
              | sort \
              | head -n 300 || true

            exit 1
          fi

          echo "$MODHOOK_FILES"

          MODHOOK_COUNT="$(
            printf '%s\n' "$MODHOOK_FILES" \
              | sed '/^$/d' \
              | wc -l
          )"

          if [ "$MODHOOK_COUNT" -ne 1 ]; then
            echo "[FAIL] expected exactly one generated ModHook.kt"
            echo "[FAIL] found: $MODHOOK_COUNT"
            exit 1
          fi

          MODHOOK_FILE="$(
            printf '%s\n' "$MODHOOK_FILES" \
              | head -n 1
          )"

          echo
          echo "[OK] generated ModHook:"
          echo "$MODHOOK_FILE"

          echo
          echo "[2/6] Checking ModHook content..."

          test -s "$MODHOOK_FILE"

          echo "[OK] ModHook.kt is not empty"

          echo
          echo "[3/6] Checking applyLocalHooks implementation..."

          if grep -Eq \
            'fun[[:space:]]+applyLocalHooks[[:space:]]*\([^)]*\)[[:space:]]*\{[[:space:]]*\}' \
            "$MODHOOK_FILE"; then

            echo "[FAIL] applyLocalHooks() appears to be empty"
            exit 1
          fi

          echo "[OK] applyLocalHooks() is not an empty implementation"

          echo
          echo "[4/6] Checking ModHook entry..."

          if grep -Eq \
            'class[[:space:]]+ModHook[^{]*:[[:space:]]*XposedModule' \
            "$MODHOOK_FILE"; then

            echo "[FAIL] ModHook.kt declares XposedModule as its base class"
            exit 1
          fi

          if grep -Eq \
            'class[[:space:]]+ModHook[^{]*extends[[:space:]]+XposedModule' \
            "$MODHOOK_FILE"; then

            echo "[FAIL] ModHook.kt extends XposedModule"
            exit 1
          fi

          echo "[OK] ModHook does not redeclare XposedModule as entry"

          echo
          echo "[5/6] Checking legacy PackageLoadedParam..."

          if grep -Fq \
            'PackageLoadedParam' \
            "$MODHOOK_FILE"; then

            echo "[FAIL] ModHook.kt still uses legacy PackageLoadedParam"
            exit 1
          fi

          echo "[OK] no legacy PackageLoadedParam in ModHook"

          echo
          echo "[6/6] Checking Module.kt integration..."

          MODULE_FILES="$(
            find app/src \
              -type f \
              -name 'Module.kt' \
              -print \
              2>/dev/null || true
          )"

          if [ -z "$MODULE_FILES" ]; then
            echo "[FAIL] Module.kt not found under app/src"
            exit 1
          fi

          MODULE_MATCH=false

          while IFS= read -r module_file; do
            [ -n "$module_file" ] || continue

            if grep -Eq \
              'ModHook[[:space:]]*\.' \
              "$module_file"; then

              echo "[OK] ModHook reference found in:"
              echo "      $module_file"

              MODULE_MATCH=true
            fi

          done <<< "$MODULE_FILES"

          if [ "$MODULE_MATCH" != "true" ]; then
            echo "[FAIL] no ModHook integration found in Module.kt"
            exit 1
          fi

          echo
          echo "================================================="
          echo "[OK] generated ModHook verification passed"
          echo "================================================="

      # =========================================================
      # 12. Setup Java
      # =========================================================
      - name: Setup Java
        if: steps.decision.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 13. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        if: steps.decision.outputs.run == 'true'
        uses: android-actions/setup-android@v3

      # =========================================================
      # 14. Setup Gradle
      # =========================================================
      - name: Setup Gradle
        if: steps.decision.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4

      # =========================================================
      # 15. Build release
      # =========================================================
      - name: Build release
        if: steps.decision.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "================================================="
          echo "Build release"
          echo "================================================="

          ./gradlew \
            :app:assembleRelease \
            --stacktrace

          echo
          echo "[OK] release build completed"

      # =========================================================
      # 16. Verify APK integration
      # =========================================================
      - name: Verify APK integration
        if: steps.decision.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Verify APK integration"
          echo "================================================="

          APK_DIR="app/build/outputs/apk/release"

          echo
          echo "[1/4] Checking release APK..."

          if [ ! -d "$APK_DIR" ]; then
            echo "[FAIL] release output directory not found:"
            echo "$APK_DIR"
            exit 1
          fi

          APK_COUNT="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              | wc -l
          )"

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "[FAIL] no release APK found"
            exit 1
          fi

          APK="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              | sort \
              | head -n 1
          )"

          echo "[OK] APK found:"
          echo "$APK"

          echo "[APK size]"
          stat -c '%n %s bytes' "$APK"

          echo
          echo "[2/4] Checking APK dex files..."

          DEX_LIST="$(
            unzip -l "$APK" \
              | awk '{print $4}' \
              | grep -E '^classes([0-9]+)?\.dex$' \
              | sort \
              || true
          )"

          if [ -z "$DEX_LIST" ]; then
            echo "[FAIL] no classes*.dex found in APK"
            exit 1
          fi

          echo "$DEX_LIST"

          echo
          echo "[3/4] Searching ModHook in compiled dex..."

          FOUND=false

          while IFS= read -r dex; do
            [ -n "$dex" ] || continue

            echo
            echo "[check] $dex"

            if unzip -p "$APK" "$dex" 2>/dev/null \
              | strings -a \
              | grep -Fq 'ModHook'; then

              echo "[OK] ModHook found in $dex"

              FOUND=true
            fi

          done <<< "$DEX_LIST"

          if [ "$FOUND" != "true" ]; then
            echo
            echo "[FAIL] ModHook was not found in compiled APK dex files"
            exit 1
          fi

          echo
          echo "[4/4] APK integration check completed"

          echo
          echo "================================================="
          echo "[OK] ModHook is present in final APK"
          echo "================================================="

      # =========================================================
      # 17. Record upstream SHA
      # =========================================================
      - name: Record upstream SHA
        if: steps.decision.outputs.run == 'true' && steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ steps.upstream.outputs.sha }}" > .upstream.sha

          echo "[upstream.sha]"
          cat .upstream.sha

      # =========================================================
      # 18. Final verification
      # =========================================================
      - name: Final verification
        if: steps.decision.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Final verification"
          echo "================================================="

          test -d mod
          test -f mod/ModHook.kt
          test -f mod/apply.sh
          test -f mod/Module.patch

          test -f .github/workflows/ci.yml
          test -f .github/workflows/upstream-sync.yml

          grep -Fq \
            'name: Sync Upstream + Build + Release' \
            .github/workflows/upstream-sync.yml

          grep -Fq \
            'git read-tree -u --reset upstream/main' \
            .github/workflows/upstream-sync.yml

          MODHOOK_FILES="$(
            find app/src \
              -type f \
              -name 'ModHook.kt' \
              -print \
              2>/dev/null || true
          )"

          if [ -z "$MODHOOK_FILES" ]; then
            echo "[FAIL] generated ModHook.kt not found"
            exit 1
          fi

          APK_COUNT="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              2>/dev/null \
              | wc -l
          )"

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "[FAIL] final APK not found"
            exit 1
          fi

          echo
          echo "[OK] generated ModHook found"
          echo "[OK] final APK count: $APK_COUNT"

          echo
          echo "================================================="
          echo "[OK] final verification passed"
          echo "================================================="

          echo
          echo "[git status]"
          git status --short

      # =========================================================
      # 19. Commit and push
      # =========================================================
      - name: Commit and push
        if: steps.decision.outputs.run == 'true' && steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "[SKIP] nothing to commit"
          else
            echo
            echo "================================================="
            echo "Commit files"
            echo "================================================="

            git diff --cached --name-status

            git commit \
              -m "sync: upstream ${{ steps.upstream.outputs.sha }}"

            git push origin HEAD:main

            echo
            echo "[OK] pushed to main"
          fi

      # =========================================================
      # 20. Determine upstream release tag
      #
      # 只认：
      #
      #   upstream/main
      #
      # 正好对应：
      #
      #   upstream-v*
      #
      # 的情况。
      #
      # 这里仅用于确定“应该发布哪个版本”。
      # 不检查本仓库 Release。
      # =========================================================
      - name: Determine upstream release tag
        if: steps.decision.outputs.run == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_SHA="${{ steps.upstream.outputs.sha }}"

          echo "================================================="
          echo "Determine upstream release tag"
          echo "================================================="

          echo "Upstream main SHA:"
          echo "$UPSTREAM_SHA"

          RELEASE_TAG=""

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue

            TAG_SHA="$(
              git rev-parse "refs/tags/$tag^{commit}" 2>/dev/null \
              || true
            )"

            echo
            echo "Checking upstream tag:"
            echo "tag=$tag"
            echo "tag_sha=$TAG_SHA"

            if [ "$TAG_SHA" = "$UPSTREAM_SHA" ]; then
              RELEASE_TAG="${tag#upstream-}"
              break
            fi

          done < <(
            git tag \
              --list 'upstream-v*' \
              --sort=-v:refname
          )

          if [ -z "$RELEASE_TAG" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"

            echo
            echo "================================================="
            echo "[INFO] upstream/main is not exactly a v* release tag"
            echo "[INFO] no GitHub Release will be created"
            echo "================================================="

            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          echo
          echo "================================================="
          echo "[OK] upstream release tag detected"
          echo "Tag: $RELEASE_TAG"
          echo "SHA: $UPSTREAM_SHA"
          echo "================================================="

      # =========================================================
      # 21. Check existing GitHub Release
      #
      # 关键：
      #
      # 只查询：
      #
      #   $GITHUB_REPOSITORY
      #
      # 即：
      #
      #   klcb2010/SwiftBackupPrem
      #
      # 不查询 upstream。
      # =========================================================
      - name: Check existing GitHub Release
        if: >
          steps.decision.outputs.run == 'true' &&
          steps.release.outputs.release == 'true'
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Check existing GitHub Release"
          echo "================================================="

          echo "Repository:"
          echo "$REPOSITORY"

          echo
          echo "Release tag:"
          echo "$TAG_NAME"

          if gh release view "$TAG_NAME" \
            --repo "$REPOSITORY" \
            >/dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo
            echo "================================================="
            echo "[SKIP] Release already exists in THIS repository"
            echo "Repository: $REPOSITORY"
            echo "Tag: $TAG_NAME"
            echo "================================================="

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo
            echo "================================================="
            echo "[OK] Release does not exist in THIS repository"
            echo "Repository: $REPOSITORY"
            echo "Tag: $TAG_NAME"
            echo "[RUN] Release will be created"
            echo "================================================="

          fi

      # =========================================================
      # 22. Prepare local release tag
      #
      # 情况 A：
      #   Tag 不存在
      #   -> 创建到当前 HEAD
      #
      # 情况 B：
      #   Tag 已存在，但 Release 不存在
      #   -> 移动到当前 HEAD
      #
      # 情况 C：
      #   Release 已存在
      #   -> 本步骤不会执行
      #
      # 这正是当前 v3.0.1 的情况：
      #
      #   old tag -> ffb816...
      #   current -> 6fc4da...
      #
      # 会把 v3.0.1 移到 6fc4da...
      # =========================================================
      - name: Prepare local release tag
        if: >
          steps.decision.outputs.run == 'true' &&
          steps.release.outputs.release == 'true' &&
          steps.check_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Prepare local release tag"
          echo "================================================="

          CURRENT_HEAD="$(git rev-parse HEAD)"

          echo "Repository : $REPOSITORY"
          echo "Tag        : $TAG_NAME"
          echo "HEAD       : $CURRENT_HEAD"

          # -----------------------------------------------------
          # 检查本地 Tag
          # -----------------------------------------------------
          if git rev-parse "refs/tags/$TAG_NAME^{commit}" >/dev/null 2>&1; then

            EXISTING_TAG_SHA="$(
              git rev-parse "refs/tags/$TAG_NAME^{commit}"
            )"

            echo
            echo "Existing tag SHA:"
            echo "$EXISTING_TAG_SHA"

            if [ "$EXISTING_TAG_SHA" = "$CURRENT_HEAD" ]; then

              echo
              echo "[OK] local tag already points to current HEAD"

            else

              echo
              echo "[INFO] existing tag points to another commit"
              echo "[INFO] no Release exists for this tag"
              echo "[INFO] moving tag to current verified HEAD"

              git tag -f "$TAG_NAME" "$CURRENT_HEAD"

              echo
              echo "[OK] local tag moved to current HEAD"

            fi

          else

            echo
            echo "[INFO] local tag does not exist"

            git tag "$TAG_NAME" "$CURRENT_HEAD"

            echo
            echo "[OK] local tag created at current HEAD"

          fi

          # -----------------------------------------------------
          # Push Tag
          #
          # Tag 不存在时：
          #   正常创建
          #
          # Tag 已存在但指向旧 Commit：
          #   force 更新
          #
          # 只有 Release 不存在时才会执行这里。
          # -----------------------------------------------------
          echo
          echo "[push] pushing release tag..."

          git push origin \
            "refs/tags/$TAG_NAME" \
            --force

          echo
          echo "================================================="
          echo "[OK] release tag prepared"
          echo "Tag : $TAG_NAME"
          echo "SHA : $CURRENT_HEAD"
          echo "================================================="

      # =========================================================
      # 23. Create GitHub Release
      #
      # 此时：
      #
      #   Tag -> 当前已经验证成功的 HEAD
      #
      # 然后创建 Release + APK。
      # =========================================================
      - name: Create GitHub Release
        if: >
          steps.decision.outputs.run == 'true' &&
          steps.release.outputs.release == 'true' &&
          steps.check_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"

          APK="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "[FAIL] release APK not found"
            exit 1
          fi

          CURRENT_HEAD="$(git rev-parse HEAD)"

          TAG_SHA="$(
            git rev-parse "refs/tags/$TAG_NAME^{commit}"
          )"

          echo "================================================="
          echo "Create GitHub Release"
          echo "================================================="

          echo "Repository : $REPOSITORY"
          echo "Tag        : $TAG_NAME"
          echo "HEAD       : $CURRENT_HEAD"
          echo "Tag SHA    : $TAG_SHA"
          echo "APK        : $APK"

          # -----------------------------------------------------
          # 最后安全检查：
          # Tag 必须指向本次已经验证成功的 HEAD。
          # -----------------------------------------------------
          if [ "$TAG_SHA" != "$CURRENT_HEAD" ]; then
            echo
            echo "[FAIL] release tag does not point to current HEAD"
            exit 1
          fi

          PRERELEASE=false

          case "$TAG_NAME" in
            *preview*|*alpha*|*beta*|*rc*)
              PRERELEASE=true
              ;;
          esac

          echo
          echo "Prerelease : $PRERELEASE"

          echo
          echo "[1/2] Creating GitHub Release..."

          if [ "$PRERELEASE" = "true" ]; then

            gh release create "$TAG_NAME" \
              --repo "$REPOSITORY" \
              --title "$TAG_NAME" \
              --generate-notes \
              --prerelease \
              "$APK"

          else

            gh release create "$TAG_NAME" \
              --repo "$REPOSITORY" \
              --title "$TAG_NAME" \
              --generate-notes \
              "$APK"

          fi

          echo
          echo "[OK] GitHub Release created"

          # -----------------------------------------------------
          # 上传 mapping
          # -----------------------------------------------------
          MAPPING="app/build/outputs/mapping/release/mapping.txt"

          if [ -f "$MAPPING" ]; then

            echo
            echo "[2/2] Uploading mapping.txt..."

            gh release upload \
              "$TAG_NAME" \
              "$MAPPING" \
              --repo "$REPOSITORY" \
              --clobber

            echo "[OK] mapping.txt uploaded"

          else

            echo
            echo "[INFO] mapping.txt not found"
            echo "[INFO] skipping mapping upload"

          fi

          echo
          echo "================================================="
          echo "[OK] GitHub Release created successfully"
          echo "================================================="

          echo
          echo "Repository:"
          echo "$REPOSITORY"

          echo
          echo "Tag:"
          echo "$TAG_NAME"

          echo
          echo "Commit:"
          echo "$CURRENT_HEAD"

          echo
          echo "APK:"
          echo "$APK"

      # =========================================================
      # 24. Release skipped
      # =========================================================
      - name: Release skipped
        if: >
          steps.decision.outputs.run == 'true' &&
          steps.release.outputs.release == 'true' &&
          steps.check_release.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "Release already exists"
          echo "================================================="

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Tag: ${{ steps.release.outputs.tag }}"

          echo
          echo "[INFO] Publishing skipped."
          echo "[INFO] Existing Release belongs to this repository."

      # =========================================================
      # 25. Upload APK artifact
      #
      # 即使没有 Release，也保留 Actions Artifact。
      # =========================================================
      - name: Upload APK
        if: steps.decision.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SwiftBackupPrem-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/*
          if-no-files-found: warn
