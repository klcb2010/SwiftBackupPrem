name: PushPlus Failure Notification

on:
  workflow_run:
    workflows:
      - "CI"
      - "Sync Upstream + Build + Release"
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "::warning::未配置仓库 Secret PUSHPLUS_TOKEN，跳过 PushPlus 通知。"
            exit 0
          fi

          payload="$(jq -n \
            --arg token "$PUSHPLUS_TOKEN" \
            --arg title "GitHub Actions运行失败通知" \
            --arg content "仓库：$REPOSITORY\\n工作流：$WORKFLOW_NAME\\n失败详情：$RUN_URL" \
            --arg template "markdown" \
            '{token:$token,title:$title,content:$content,template:$template}')"

          curl --fail --silent --show-error \
            --request POST \
            --url "https://www.pushplus.plus/send" \
            --header "Content-Type: application/json" \
            --data "$payload"
